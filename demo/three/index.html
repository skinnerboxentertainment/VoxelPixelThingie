<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VPB Three.js WebGPU</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0b0f19; color: #c9d1d9; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      #bar { position: fixed; left: 0; right: 0; top: 0; display: flex; gap: 8px; align-items: center; padding: 8px 12px; z-index: 2; }
      select, button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer; }
      #hud { position: fixed; right: 12px; top: 48px; background: rgba(13,17,23,.85); border: 1px solid #30363d; border-radius: 8px; padding: 8px 12px; font-family: ui-monospace, monospace; white-space: pre; z-index: 2; }
      #stage { position: fixed; inset: 0; display: block; }
      .hint { color: #8b949e; margin-left: auto; }
      #status { color: #8b949e; }
      #panel { position: fixed; left: 12px; bottom: 12px; width: 360px; background: rgba(13,17,23,.92); border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; z-index: 2; }
      #panel-title { font-family: ui-monospace, monospace; margin-bottom: 6px; white-space: pre; }
      #passport { width: 100%; box-sizing: border-box; background: #0b0f19; color: #c9d1d9; border: 1px solid #30363d; border-radius: 6px; font: 12px/1.4 ui-monospace, monospace; padding: 6px; }
      .row { display: flex; gap: 8px; margin-top: 6px; }
      #panel-error { color: #f85149; min-height: 1.2em; margin-top: 4px; }
      #stage:focus-visible { outline: 2px solid #58a6ff; outline-offset: -2px; }
      button:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
      #text-view { position: fixed; right: 12px; top: 48px; bottom: 12px; width: 420px; overflow: auto; background: rgba(13,17,23,.95); border: 1px solid #30363d; border-radius: 8px; padding: 10px 12px; z-index: 3; font-family: ui-monospace, monospace; font-size: 12px; }
      #text-view h2 { font-size: 13px; margin: 0 0 6px; }
      #text-view ol { margin: 0; padding-left: 28px; }
      .muted { color: #8b949e; }
    </style>
  </head>
  <body>
    <div id="bar">
      <label>size <select id="size"><option value="8" selected>8³</option><option value="16">16³</option><option value="32">32³</option></select></label>
      <button type="button" id="reset">reset scene</button>
      <button type="button" id="save" title="write this scene to the browser's private file system">save</button>
      <button type="button" id="load" title="read the saved scene back">load</button>
      <label title="stream every change to the browser's private file system through a worker"><input type="checkbox" id="autosave" /> autosave</label>
      <button type="button" id="load-autosave" title="open the autosaved scene">load autosave</button>
      <button type="button" id="text-toggle" aria-pressed="false" aria-controls="text-view">text view</button>
      <span id="status" role="status" aria-live="polite"></span>
      <span class="hint">drag to orbit · wheel to zoom · click a bit to open its passport</span>
    </div>
    <canvas id="stage" tabindex="0" aria-label="Scene. Arrow keys move the cursor, Page Up and Page Down move it in depth, Enter opens the bit under it, Delete removes it, Escape closes the panel."></canvas>
    <div id="hud" aria-hidden="true"></div>
    <section id="text-view" hidden aria-live="polite" aria-label="the scene as text"><h2>The scene as text</h2><p id="text-head"></p><ol id="text-list"></ol></section>
    <div id="panel" hidden role="dialog" aria-labelledby="panel-title">
      <div id="panel-title"></div>
      <label for="passport" class="muted">passport, a JSON object</label>
      <textarea id="passport" rows="8" spellcheck="false"></textarea>
      <div class="row">
        <button type="button" id="apply">set passport</button>
        <button type="button" id="remove">remove bit</button>
        <button type="button" id="close">close</button>
      </div>
      <div class="row">
        <label>job <select id="job-kind"><option value="led-frame-gpu">led-frame on the GPU</option><option value="led-frame">led-frame on the CPU</option><option value="links">links</option><option value="epcis">epcis</option></select></label>
        <button type="button" id="run-job" title="ask this bit for work; request, result, audit, and reward land in its ledger">run job</button>
      </div>
      <div id="job-audit" class="muted"></div>
      <div id="panel-error" role="alert"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
