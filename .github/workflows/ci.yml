name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-check:
    name: release-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The head commit, not the pull request's merge commit: the manifest names
      # the commit it built, and a build elsewhere of the same commit must match.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same build a release makes (RELEASING.md): its manifest digest is
      # compared against a build of the same commit on another machine.
      - run: npm run release:build
      - run: node -e "const m=require('./release/release.json');console.log('release digest '+m.digest+' at '+m.commit)"
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: release/
          retention-days: 30

  conformance-kit:
    name: conformance-kit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # A second implementation, standard library only, against the fixtures alone (PLAN-4.md Phase 25).
      - run: python kit/python/run_kit.py conformance
